name: Build Linux App

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Python Dependencies
        run: pip install pyinstaller ytmusicapi bs4
        working-directory: server

      - name: Compile Python Sidecar (Linux)
        run: bash compile.sh
        working-directory: server

      - name: Install Node Dependencies
        run: npm install
        working-directory: client

      - name: Build Tauri App (Linux)
        run: APPIMAGE_EXTRACT_AND_RUN=1 npm run tauri build
        working-directory: client

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: spotipoop-linux-installer
          path: |
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/appimage/*.AppImage
